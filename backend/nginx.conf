events {
    worker_connections 1024;
}

http {
    upstream fastapi_backend {
        # 'backend' merujuk pada nama service di docker-compose.yml
        server backend:8000;
    }

    server {
        listen 80;
        
        server_name api.verify.adwira.dev;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # ==========================================
            # KONFIGURASI KRUSIAL UNTUK SSE (STREAMING)
            # ==========================================
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            
            # Timeout yang sangat panjang (1 jam) agar AI punya waktu berpikir
            # dan tidak diputus oleh Nginx di tengah jalan
            proxy_read_timeout 3600s; 
            proxy_send_timeout 3600s;
        }
    }
}