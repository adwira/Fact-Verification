worker_processes auto;

events {
    worker_connections 1024;
}

http {
  
    # Blok HTTP (Port 80) -> Force Redirect ke HTTPS
    server {
        listen 80;
        server_name api.domainanda.com; # Ganti dengan domain Anda
        return 301 https://$host$request_uri;
    }

    # Blok HTTPS (Port 443)
    server {
        listen 443 ssl;
        server_name api.verify.adwira.dev; # Ganti dengan domain Anda

        # Sertifikat SSL Let's Encrypt
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        
        # Standar Keamanan SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # ==========================================================
        # 2. SECURITY HEADERS
        # ==========================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;

        location / {
            # ==========================================================
            # 3. DYNAMIC PROXY PASS (Penyelesaian masalah Upstream)
            # ==========================================================
            # Menggunakan variabel $upstream memaksa Nginx menggunakan resolver Docker
            set $upstream_fastapi http://backend:8000;
            proxy_pass $upstream_fastapi;

            # Meneruskan informasi IP client asli ke FastAPI
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # ==========================================================
            # 4. KONFIGURASI KHUSUS SSE (Server-Sent Events)
            # ==========================================================
            proxy_http_version 1.1;
            proxy_set_header Connection "keep-alive"; # Paksa jalur tetap hidup
            
            # Matikan semua buffering agar streaming AI langsung tampil di Frontend
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            
            # Beri waktu 1 jam untuk AI berpikir (mencegah koneksi diputus Nginx)
            proxy_read_timeout 3600s; 
            proxy_send_timeout 3600s;
        }
    }
}